# Compila os instaladores do adjeltron (Windows + macOS) a partir do código do repositório
# adjelritmos/adjeltron e publica-os como Release NESTE repositório (público).
#
#  • Publicar uma versão:  GitHub → Actions → "Release (Windows + macOS)" → Run workflow
#    → em "versão" escreva a tag que já existe no repositório do código (ex.: v0.3.0).
#    → cria aqui a Release "adjeltron v0.3.0" com os instaladores
#      (Windows: .exe e .msi; macOS: .dmg universal, Apple Silicon + Intel).
#    Alternativa: criar e enviar a mesma tag neste repositório (git tag v0.3.0 && git push origin v0.3.0).
#  • Testar sem publicar: Run workflow com "publicar" desligado → os instaladores ficam em "Artifacts".
#
# Configuração (uma vez):
#  O código está num repositório privado, por isso este workflow precisa de um token para o ler:
#   1. GitHub → Settings → Developer settings → Fine-grained tokens → Generate new token
#      Repository access: só "adjelritmos/adjeltron"; Permissions → Contents: Read-only.
#   2. Neste repositório: Settings → Secrets and variables → Actions → New repository secret
#      Nome: SOURCE_TOKEN   Valor: o token criado.
#  (Se o repositório do código passar a público, o secret deixa de ser necessário.)
#
# A versão mostrada na app vem de desktop/src-tauri/tauri.conf.json ("version") no código;
# atualize-a lá antes de criar a tag.
name: Release (Windows + macOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag do código a compilar e nome da Release (ex.: v0.3.0)'
        required: true
      publish:
        description: 'Publicar a Release (desligado = só Artifacts)'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write # para criar a Release e anexar os instaladores

env:
  SOURCE_REPO: adjelritmos/adjeltron
  VERSION: ${{ inputs.version || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis,msi
            rust-targets: ''
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Código do adjeltron (${{ env.VERSION }})
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.VERSION }}
          token: ${{ secrets.SOURCE_TOKEN || github.token }}
          path: src
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/desktop/src-tauri -> target

      - name: Dependências (frontend + desktop)
        run: |
          (cd src/frontend && (bun install --frozen-lockfile || bun install))
          (cd src/desktop && bun install --ignore-scripts)

      # o beforeBuildCommand (tauri.conf.json → bun run build:ui) compila a interface com o Vite;
      # o servidor local (compilação, MQTT…) é Rust, dentro da própria app
      - name: Build e Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # a Release é criada neste repositório
        with:
          projectPath: src/desktop
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          tagName: ${{ env.PUBLISH == 'true' && env.VERSION || '' }}
          releaseName: 'adjeltron ${{ env.VERSION }}'
          releaseBody: |
            ## Descarregar
            - **Windows**: `adjeltron_*_x64-setup.exe` (instalador) ou `.msi`
            - **macOS** (Apple Silicon e Intel): `adjeltron_*_universal.dmg`

            **macOS:** a app ainda não é verificada (notarizada) pela Apple. Na primeira vez (e a cada
            versão nova): abra-a e, quando o macOS avisar, vá a **Definições do Sistema → Privacidade e
            Segurança → Abrir mesmo assim**. No macOS 15 o "clique direito → Abrir" já não serve.
            Em alternativa, no Terminal: `xattr -dr com.apple.quarantine /Applications/adjeltron.app`

            **Windows:** se o SmartScreen avisar, carregue em **Mais informações → Executar mesmo assim**.
          releaseDraft: false
          prerelease: false

      - name: Guardar os instaladores (Artifacts)
        uses: actions/upload-artifact@v5
        with:
          name: adjeltron-${{ env.VERSION }}-${{ runner.os }}
          path: |
            src/desktop/src-tauri/target/release/bundle/nsis/*.exe
            src/desktop/src-tauri/target/release/bundle/msi/*.msi
            src/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
