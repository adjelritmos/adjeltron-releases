# Instaladores da app desktop adjeltron (Tauri) para Windows e macOS.
#
#  • Publicar uma versão:  git tag v0.1.0 && git push origin v0.1.0
#    → cria a Release "adjeltron v0.1.0" no GitHub com os instaladores
#      (Windows: .exe e .msi; macOS: .dmg universal, Apple Silicon + Intel).
#  • Testar sem publicar:  GitHub → Actions → "Release (Windows + macOS)" → Run workflow
#    → os instaladores ficam em "Artifacts" no fim da execução.
#
# A versão mostrada na app vem de desktop/src-tauri/tauri.conf.json ("version"):
# atualize-a (e as de desktop/package.json e frontend/package.json) antes de criar a tag.
# O projeto desktop (pasta desktop/) usa a interface de frontend/src — os dois são instalados.
name: Release (Windows + macOS)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # para criar a Release e anexar os instaladores

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis,msi
            rust-targets: ''
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Dependências (frontend + desktop)
        run: |
          (cd frontend && (bun install --frozen-lockfile || bun install))
          (cd desktop && bun install --ignore-scripts)

      # o beforeBuildCommand (tauri.conf.json → bun run build:ui) compila a interface com o Vite;
      # o servidor local (compilação, MQTT…) é Rust, dentro da própria app
      - name: Build e (com tag) Release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'adjeltron ${{ github.ref_name }}'
          releaseBody: |
            ## Descarregar
            - **Windows**: `adjeltron_*_x64-setup.exe` (instalador) ou `.msi`
            - **macOS** (Apple Silicon e Intel): `adjeltron_*_universal.dmg`

            **macOS:** a app ainda não é verificada (notarizada) pela Apple. Na primeira vez (e a cada
            versão nova): abra-a e, quando o macOS avisar, vá a **Definições do Sistema → Privacidade e
            Segurança → Abrir mesmo assim**. No macOS 15 o "clique direito → Abrir" já não serve.
            Em alternativa, no Terminal: `xattr -dr com.apple.quarantine /Applications/adjeltron.app`

            **Windows:** se o SmartScreen avisar, carregue em **Mais informações → Executar mesmo assim**.
          releaseDraft: false
          prerelease: false

      - name: Guardar os instaladores (Artifacts)
        uses: actions/upload-artifact@v5
        with:
          name: adjeltron-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
