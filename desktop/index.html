<!doctype html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preload" as="image" href="/splash.webp" type="image/webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>adjeltron</title>
  <style>
    /* splash: visível logo no primeiro pintar, antes do JS/React carregar */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      background: #0a0a0a; transition: opacity .45s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: min(46vmin, 420px); height: auto; border-radius: 16px; }
    #splash .bar { width: min(40vmin, 260px); height: 3px; border-radius: 3px; background: #ffffff14; overflow: hidden; }
    #splash .bar::after {
      content: ''; display: block; width: 40%; height: 100%; background: #fff; border-radius: 3px;
      animation: splash-load 1.1s ease-in-out infinite;
    }
    @keyframes splash-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>

<body>
  <div id="splash" role="status" aria-label="A carregar o adjeltron">
    <img src="/splash.webp" alt="adjeltron" width="840" height="840" />
    <div class="bar"></div>
  </div>
  <div id='threejs'></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
