[package]
name = "adjeltron"
version = "0.4.0"
description = "adjeltron — desenho e simulação de circuitos e robôs"
edition = "2021"

[lib]
name = "adjeltron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
base64 = "0.22"
regex = "1"
which = "7"
dirs = "6"
reqwest = { version = "0.12", features = ["stream"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
if-addrs = "0.13"
gethostname = "0.5"
tempfile = "3"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
